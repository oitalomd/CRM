# Canary isolado: PostgreSQL + pgvector + PostgREST.
# Não publica portas e não participa do roteamento Traefik.
# A aplicação só deve registrar este endpoint depois dos testes de promoção.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: deskcomm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - deskcomm-data-plane-canary-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deskcomm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal, coolify]
    logging: *logging

  db-init:
    image: postgres:17-alpine
    restart: "no"
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
      sql-fetch:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        psql -h db -U postgres -d deskcomm -v ON_ERROR_STOP=1 -f /sql/selfhost-prelude.sql
        psql -h db -U postgres -d deskcomm -v ON_ERROR_STOP=1 -f /sql/data-plane-operational-contract.sql
        psql -q -h db -U postgres -d deskcomm -v ON_ERROR_STOP=1 -f /sql/baseline.sql
    volumes:
      - deskcomm-data-plane-canary-sql:/sql:ro
    networks: [internal]
    logging: *logging

  sql-fetch:
    image: busybox:1.36.1
    restart: "no"
    mem_limit: 128m
    command:
      - /bin/sh
      - -ec
      - |
        wget -qO /sql/selfhost-prelude.sql https://raw.githubusercontent.com/oitalomd/CRM/codex/hybrid-repaired/scripts/selfhost-prelude.sql
        wget -qO /sql/data-plane-operational-contract.sql https://raw.githubusercontent.com/oitalomd/CRM/codex/hybrid-repaired/scripts/data-plane-operational-contract.sql
        wget -qO /sql/baseline.sql https://raw.githubusercontent.com/oitalomd/CRM/codex/hybrid-repaired/supabase/baseline.sql
    volumes:
      - deskcomm-data-plane-canary-sql:/sql
    networks: [internal]
    logging: *logging

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/deskcomm
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL: 5
      PGRST_SERVER_PORT: 3000
    networks: [internal, coolify]
    logging: *logging

  smoke:
    image: busybox:1.36.1
    restart: "no"
    depends_on:
      postgrest:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - |
        for attempt in $(seq 1 30); do
          if wget -qO- http://postgrest:3000/ >/dev/null; then exit 0; fi
          sleep 1
        done
        exit 1
    networks: [internal]
    logging: *logging

  coolify-smoke:
    image: busybox:1.36.1
    restart: "no"
    depends_on:
      postgrest:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - |
        for attempt in $(seq 1 30); do
          if wget -qO- http://postgrest:3000/ >/dev/null; then exit 0; fi
          sleep 1
        done
        exit 1
    networks: [coolify]
    logging: *logging

volumes:
  deskcomm-data-plane-canary-db:
  deskcomm-data-plane-canary-sql:

networks:
  internal:
    driver: bridge
  coolify:
    external: true
    name: coolify
